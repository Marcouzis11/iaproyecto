# Integración continua: en cada push y pull request instala el proyecto con las versiones fijadas,
# corre las pruebas automáticas y prueba el MVP (rx-predecir) con las radiografías de ejemplo.
# No necesita el dataset: las pruebas usan datos sintéticos y el modelo final está versionado.
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # versión con la que se entrenó el modelo
          - os: windows-latest
            python: "3.13"   # versión verificada en Windows 11
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: PyTorch solo CPU (Linux)
        if: runner.os == 'Linux'
        # En Linux, la rueda de PyPI trae CUDA (varios GB); la de CPU alcanza y respeta las mismas versiones.
        run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar el proyecto (versiones fijadas)
        run: python -m pip install -e .

      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: MVP · rx-predecir sobre las radiografías de ejemplo
        run: |
          rx-predecir examples/radiografias/*.png
          rx-predecir --json examples/radiografias/*.png > prediccion.json
          python - <<'EOF'
          import json
          esperado = {'00000643_006.png': 'Effusion', '00004526_023.png': 'sin Effusion',
                      '00022899_024.png': 'Effusion', '00030344_002.png': 'sin Effusion'}
          resultado = json.load(open('prediccion.json', encoding='utf-8'))
          clases = {p['imagen'].replace('\\', '/').split('/')[-1]: p['clase'] for p in resultado['predicciones']}
          assert clases == esperado, f'Las clases cambiaron: {clases}'
          print('Las 4 radiografías de ejemplo dan la clase documentada en el README.')
          EOF

      - name: MVP · error claro con un archivo que no es imagen
        run: |
          if rx-predecir README.md; then
            echo "rx-predecir debería fallar con un archivo que no es imagen" && exit 1
          fi
